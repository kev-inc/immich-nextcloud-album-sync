immich_api_url: http://immich_server:2283/api
nextcloud_url: https://cloud.example.com

# ── Single global setting for ALL users ──
# Everything behavioural lives here. Per-user blocks below only carry
# identity, keys and library folders.
# NOTE: this file holds real secrets on a live system. Placeholders are
# committed; never commit real keys (this repo is public — keep your
# deployment's copy out of git).
settings:
  # CREATE = only create/append, never deletes.
  # UPDATE = CREATE + prune stale albums (removed/renamed folders).
  # CLEANUP / DELETE_ALL = destructive teardown modes, need delete_confirm: true.
  mode: UPDATE
  # Mirror Nextcloud folder shares into .albumprops so matching Immich albums
  # are shared with the same users. Needs a per-user app password (see below).
  share_sync: true
  album_levels: 1
  album_separator: " "
  sync_interval_minutes: 60   # every user runs on this schedule
  # cron: "0 * * * *"          # alternative to the interval above
  chunk_size: 2000
  fetch_chunk_size: 1000
  log_level: INFO
  sync_mode: 0   # only used when mode is CREATE (UPDATE always forces 2)
  insecure: false
  find_assets_in_albums: false

# ── Users: identity + keys + folders ──
# Uncomment + paste real values. Commented-out keys = that feature is skipped
# (no API key → sync refused with a clear error; no app password → share
# sync skipped for that user).
users:
  - username: alice                     # Immich account
    # api_key: "PASTE_ALICE_IMMICH_API_KEY"
    # nextcloud_user: alice             # Nextcloud login, if different
    # nextcloud_app_password: "PASTE_ALICE_NC_APP_PASSWORD"
    root_paths:
      - /external_libs/alice_photos

  - username: bob
    # api_key: "PASTE_BOB_IMMICH_API_KEY"
    # nextcloud_user: bob
    # nextcloud_app_password: "PASTE_BOB_NC_APP_PASSWORD"
    root_paths:
      - /external_libs/bob_photos
